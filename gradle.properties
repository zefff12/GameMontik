org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# APK, собранный кнопкой Run/Build в Android Studio, можно ставить на телефон вручную (иначе он помечен testOnly и не устанавливается).
android.injected.testOnly=false
# Собирать APK сразу под все процессоры телефонов (arm64, armeabi, x86), а не только под эмулятор.
# Без этого кнопка Run даёт APK только для x86_64 и телефон пишет «несовместимо».
android.buildOnlyTargetAbi=false
